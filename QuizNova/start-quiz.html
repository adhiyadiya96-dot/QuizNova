<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>


<nav class="navbar fixed-top">
  <div class="container d-flex justify-content-between">
    <span class="fw-bold fs-4">QuizNova</span>
    <span class="text-muted">Start Quiz</span>
  </div>
</nav>
<div style="height:90px"></div>


<div class="container fade-in">
  <div class="card p-5 text-center">

    <div class="icon mb-3">
      <i class="bi bi-play-circle"></i>
    </div>

    <h2>Ready to Begin?</h2>
    <p class="text-muted mt-2">
      You are about to start the quiz. Once started, you must complete it.
    </p>

    <div class="mt-4">
      <p><strong>Subject:</strong> Selected Subject</p>
      <p><strong>Total Questions:</strong> 10</p>
      <p><strong>Time Limit:</strong> 10 Minutes</p>
    </div>

    <div class="mt-4">
      <a href="instructions.html" class="btn btn-outline-light me-2">
        <i class="bi bi-arrow-left"></i> Back
      </a>

      <a href="loader.html" class="btn btn-primary">
        Begin Quiz <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </div>
</div>


<footer class="mt-5">
  <div class="container py-4 text-center">
    © 2026 QuizNova | Academic Project
  </div>
</footer>

</body>
</html>
