<!DOCTYPE html>
<html>
<head>
  <title>Profile | QuizNova</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container">
      <span class="fw-bold fs-4">QuizNova</span>
    </div>
  </nav>

  <div style="height:90px"></div>

  <div class="container fade-soft">
    <div class="row g-4">

      <!-- Left Profile Card -->
      <div class="col-lg-4">
        <div class="card p-4 text-center profile-card h-100">

          <div class="avatar-circle mb-3">
            <i class="bi bi-person"></i>
          </div>

          <h5 class="fw-semibold mb-1">Student Name</h5>
          <p class="text-muted small mb-3">student@example.com</p>

          <hr class="soft-divider">

          <div class="text-start small">
            <p class="mb-3">
              <span class="label-title">User ID</span><br>
              QN10245
            </p>

            <p class="mb-3">
              <span class="label-title">Joined On</span><br>
              January 2026
            </p>

            <p class="mb-0">
              <span class="label-title">Last Login</span><br>
              2 Days Ago
            </p>
          </div>

        </div>
      </div>

      
      <div class="col-lg-8">
        <div class="card p-4 profile-card h-100">

          <h5 class="fw-semibold mb-4">User Overview</h5>

          
          <div class="row text-center mb-4">

            <div class="col-md-4">
              <div class="stat-minimal">
                <p class="text-muted small mb-1">Quizzes Attempted</p>
                <h5 class="fw-semibold mb-0">5</h5>
              </div>
            </div>

            <div class="col-md-4">
              <div class="stat-minimal">
                <p class="text-muted small mb-1">Best Score</p>
                <h5 class="fw-semibold mb-0">9 / 10</h5>
              </div>
            </div>

            <div class="col-md-4">
              <div class="stat-minimal">
                <p class="text-muted small mb-1">Accuracy</p>
                <h5 class="fw-semibold mb-0">90%</h5>
              </div>
            </div>

          </div>

          <hr class="soft-divider">

          <!-- Details -->
          <div class="profile-details small">

            <div class="row mb-3">
              <div class="col-sm-4 text-muted">Full Name</div>
              <div class="col-sm-8">Student Name</div>
            </div>

            <div class="row mb-3">
              <div class="col-sm-4 text-muted">Email</div>
              <div class="col-sm-8">student@example.com</div>
            </div>

            <div class="row mb-3">
              <div class="col-sm-4 text-muted">Account Type</div>
              <div class="col-sm-8">Student</div>
            </div>

            <div class="row mb-3">
              <div class="col-sm-4 text-muted">Status</div>
              <div class="col-sm-8">Active</div>
            </div>

            <div class="row">
              <div class="col-sm-4 text-muted">Preferred Language</div>
              <div class="col-sm-8">English</div>
            </div>

          </div>

        </div>
      </div>

    </div>

    <!-- Logout -->
    <div class="card p-3 mt-4 text-end profile-card">
      <a href="index.html" class="btn btn-primary btn-sm px-4">Logout</a>
    </div>

  </div>

</body>
</html>
